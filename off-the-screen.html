<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Off The Screen — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --bg-soft: #FFF3EC;
    --ink: #16130F;
    --ink-muted: #6b645c;
    --orange: #FF5B1F;
    --orange-deep: #D94812;
    --rule: rgba(22, 19, 15, 0.1);
    --max-w: 880px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'DM Sans', -apple-system, sans-serif;
    line-height: 1.55;
  }
  .wrap { max-width: var(--max-w); margin: 0 auto; padding: 0 24px; }
  h1, h2, h3 { font-family: 'Space Grotesk', sans-serif; margin: 0; }
  .pop-shadow { text-shadow: 4px 4px 0 var(--orange); }
  a { color: var(--orange-deep); }

  nav {
    position: sticky; top: 0; z-index: 10;
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--rule);
  }
  nav .wrap { display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; }
  .nav-logo { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 18px; text-decoration: none; color: var(--ink); }
  .nav-links { display: flex; gap: 22px; list-style: none; margin: 0; padding: 0; }
  .nav-links a { color: var(--ink); text-decoration: none; font-weight: 500; font-size: 14.5px; }
  .nav-links a:hover, .nav-links a.current { color: var(--orange-deep); }

  .page-header { padding: 60px 24px 20px; text-align: center; }
  .page-header .kicker { font-size: 13px; font-weight: 700; color: var(--orange-deep); letter-spacing: 0.08em; text-transform: uppercase; }
  .page-header h1 { font-size: clamp(34px, 7vw, 54px); margin-top: 6px; }

  .btn {
    display: inline-block; background: var(--orange); color: #fff; text-decoration: none;
    font-weight: 700; padding: 14px 30px; border-radius: 100px; font-size: 15px;
    box-shadow: 4px 4px 0 var(--ink);
  }
  .btn:hover { transform: translate(-1px, -1px); box-shadow: 5px 5px 0 var(--ink); }

  .section { padding: 50px 24px 80px; }

  /* Projects */
  .project-row { display: flex; gap: 40px; align-items: center; margin-bottom: 80px; }
  .project-row:last-child { margin-bottom: 0; }
  .project-row.reverse { flex-direction: row-reverse; margin-top: 50px; }
  .project-shot { flex: 1 1 320px; min-width: 0; }
  .screenshot-mock { border-radius: 14px; overflow: hidden; aspect-ratio: 4/3; box-shadow: 8px 8px 0 var(--ink); display: flex; flex-direction: column; }
  .screenshot-chrome { background: #2b2620; padding: 9px 12px; display: flex; gap: 6px; }
  .screenshot-chrome span { width: 9px; height: 9px; border-radius: 50%; background: #FF5B1F; opacity: 0.85; }
  .screenshot-chrome span:nth-child(2) { opacity: 0.55; }
  .screenshot-chrome span:nth-child(3) { opacity: 0.3; }
  .screenshot-body { flex: 1; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 22px; color: #fff; text-align: center; padding: 20px; }
  .project-info { flex: 1 1 320px; min-width: 0; }
  .project-info h3 { font-size: 26px; margin-bottom: 8px; }
  .project-role { display: inline-block; font-size: 13px; font-weight: 700; color: var(--orange-deep); margin-bottom: 14px; }
  .project-info p.desc { color: var(--ink-muted); margin: 0 0 16px; }
  .stack-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .stack-tags span { font-size: 12.5px; font-weight: 600; background: var(--bg-soft); color: var(--orange-deep); padding: 5px 11px; border-radius: 100px; }
  .project-link { font-weight: 700; font-size: 14.5px; text-decoration: none; }
  .project-link::after { content: " →"; }
  @media (max-width: 720px) { .project-row, .project-row.reverse { flex-direction: column; margin-top: 0; } }

  /* About */
  .about-grid { display: flex; gap: 40px; flex-wrap: wrap; margin-bottom: 60px; }
  .skills-col { flex: 1; min-width: 240px; }
  .skills-col h3 { font-size: 18px; margin-bottom: 14px; }
  .skills-col ul { list-style: none; margin: 0; padding: 0; }
  .skills-col li { padding: 9px 0; border-bottom: 1px solid var(--rule); font-size: 15px; }
  .skills-col.learning li::before { content: ""; }
  .skills-col.know li::before { content: " "; }
  .open-badge { display: inline-flex; align-items: center; gap: 8px; background: var(--ink); color: #fff; padding: 10px 20px; border-radius: 100px; font-weight: 700; font-size: 14px; margin-bottom: 50px; }
  .open-badge .dot { width: 9px; height: 9px; border-radius: 50%; background: #4ADE80; display: inline-block; }
  .timeline { position: relative; padding-left: 28px; }
  .timeline::before { content: ""; position: absolute; left: 6px; top: 6px; bottom: 6px; width: 2px; background: var(--rule); }
  .timeline-item { position: relative; padding-bottom: 32px; }
  .timeline-item:last-child { padding-bottom: 0; }
  .timeline-item::before { content: ""; position: absolute; left: -28px; top: 4px; width: 14px; height: 14px; border-radius: 50%; background: var(--orange); border: 3px solid var(--bg); }
  .timeline-year { font-family: 'Space Grotesk', sans-serif; font-weight: 700; color: var(--orange-deep); font-size: 14px; }
  .timeline-item p { margin: 4px 0 0; color: var(--ink-muted); }

  /* Off the Screen */
  .hobby-grid { display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; }
  .hobby-photo { width: 220px; height: 260px; border-radius: 14px; background-size: cover; background-position: center; box-shadow: 6px 6px 0 var(--ink); }
  .hobby-photo:nth-child(2) { transform: rotate(-3deg) translateY(14px); }
  .hobby-photo:nth-child(1) { transform: rotate(2deg); }
  .hobby-photo:nth-child(3) { transform: rotate(-1deg) translateY(6px); }
  .hobby-intro { text-align: center; max-width: 480px; margin: 0 auto 40px; color: var(--ink-muted); }

  /* Say Hi */
  .say-hi { text-align: center; }
  .say-hi p.lead { font-size: 18px; color: var(--ink-muted); max-width: 440px; margin: 0 auto 34px; }
  .socials { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; margin-top: 40px; }
  .socials a { text-decoration: none; font-weight: 700; font-size: 14px; color: var(--ink); border: 2px solid var(--ink); padding: 10px 20px; border-radius: 100px; }
  .socials a:hover { background: var(--ink); color: #fff; }

  /* Home hero */
  .hero { padding: 90px 24px 70px; text-align: center; }
  .hero .eyebrow { display: inline-block; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--orange-deep); background: var(--bg-soft); padding: 6px 14px; border-radius: 100px; margin-bottom: 22px; transform: rotate(-2deg); }
  .hero h1 { font-size: clamp(42px, 9vw, 72px); font-weight: 700; line-height: 1.04; margin-bottom: 18px; }
  .hero p.tagline { font-size: 18px; color: var(--ink-muted); max-width: 480px; margin: 0 auto 30px; }

  footer { text-align: center; padding: 34px 24px; color: var(--ink-muted); font-size: 13px; border-top: 1px solid var(--rule); margin-top: 40px; }
</style>
</head>
<body>
<nav>
  <div class="wrap">
    <a href="index.html" class="nav-logo">Vee.Makes things</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="projects.html">Projects</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="off-the-screen.html" class="current">Off The Screen</a></li>
      <li><a href="say-hi.html">Say Hi</a></li>
    </ul>
  </div>
</nav>
<div class="page-header">
  <div class="kicker">Off The Screen</div>
  <h1>When I'm not coding</h1>
</div>
<section class="section">
  <div class="wrap">
    <p class="hobby-intro">Mostly found drawing something that'll never see daylight, or deep into a game I swore I'd only play for an hour.</p>
    <div class="hobby-grid">
      <div class="hobby-photo" style="background-image:url('images/drawing 1.jpg')"></div>
      <div class="hobby-photo" style="background-image:url('images/drawing 2.jpg')"></div>
      <div class="hobby-photo" style="background-image:url('images/drawing 3.jpg')"></div>
    </div>
  </div>
</section>

<footer>
  &copy; <span id="year"></span> &mdash; built with HTML, CSS, and a lot of trial and error.
</footer>
<script>document.getElementById("year").textContent = new Date().getFullYear();</script>
</body>
</html>
